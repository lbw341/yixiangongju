<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="一线工具平台 - 专业的项目周报生成器、技术文档生成工具，支持Excel文件读取、批量处理等功能">
    <meta name="keywords" content="项目周报生成器,技术文档生成,Excel工具,工具平台,周报工具">
    <meta name="author" content="一线工具平台">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="一线工具平台">
    <meta property="og:description" content="专业的项目周报生成器和技术文档生成工具平台">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.toolplatform.com">
    <title>一线工具平台 - 专业的项目周报生成器和技术文档生成工具</title>
    
    <!-- CDN 依赖 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 登录页面 -->
    <div id="login-page" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600">
        <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md mx-4">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-tools text-white text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold">一线工具平台</h1>
                <p class="text-gray-500 mt-2">专业的项目周报生成器</p>
            </div>
            
            <!-- 标签页切换 -->
            <div class="flex bg-gray-100 rounded-lg p-1 mb-6">
                <button id="tab-login" class="flex-1 py-2 rounded-lg font-semibold transition bg-indigo-600 text-white" onclick="switchLoginTab('login')">登录</button>
                <button id="tab-register" class="flex-1 py-2 rounded-lg font-semibold transition text-gray-500" onclick="switchLoginTab('register')">注册</button>
            </div>
            
            <!-- 登录表单 -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                    <input id="login-username" type="text" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                    <input id="login-password" type="password" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition">登录</button>
            </form>
            
            <!-- 注册表单 -->
            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                    <input id="reg-username" type="text" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" oninput="checkUsername()">
                    <div id="username-check" class="mt-1 text-sm"></div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">密码 (至少6位)</label>
                    <input id="reg-password" type="password" required minlength="6" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">昵称</label>
                    <input id="reg-nickname" type="text" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">注册身份</label>
                    <select id="reg-role" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                        <option value="user">普通用户</option>
                        <option value="author">作者</option>
                    </select>
                    <p class="text-xs text-gray-500 mt-1">普通用户可使用工具和反馈，作者可上传和管理工具</p>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition">注册</button>
            </form>
        </div>
    </div>

    <!-- 主应用 -->
    <div id="app" class="hidden">
        <!-- 侧边栏 -->
        <aside class="sidebar bg-gray-900 text-gray-300">
            <div class="p-4 flex items-center gap-3">
                <i class="fas fa-tools text-indigo-400 text-2xl"></i>
                <span class="logo-text text-lg font-bold text-white">工具平台</span>
            </div>
            <nav class="mt-6 space-y-2 px-2">
                <a href="#home" class="nav-link active flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 hover:text-white transition" onclick="event.preventDefault(); switchPage('home')">
                    <i class="fas fa-home w-5"></i>
                    <span class="nav-text">首页</span>
                </a>
                <div class="pt-4 pb-2">
                    <span class="nav-text text-xs text-gray-500 uppercase px-4">工具分类</span>
                </div>
                <a href="#planning" class="nav-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 hover:text-white transition" onclick="event.preventDefault(); switchPage('category', '规划')">
                    <i class="fas fa-project-diagram w-5"></i>
                    <span class="nav-text">规划</span>
                </a>
                <a href="#construction" class="nav-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 hover:text-white transition" onclick="event.preventDefault(); switchPage('category', '建设')">
                    <i class="fas fa-hammer w-5"></i>
                    <span class="nav-text">建设</span>
                </a>
                <a href="#optimization" class="nav-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 hover:text-white transition" onclick="event.preventDefault(); switchPage('category', '优化')">
                    <i class="fas fa-chart-line w-5"></i>
                    <span class="nav-text">优化</span>
                </a>
                <a href="#maintenance" class="nav-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 hover:text-white transition" onclick="event.preventDefault(); switchPage('category', '维护')">
                    <i class="fas fa-wrench w-5"></i>
                    <span class="nav-text">维护</span>
                </a>
                <a href="#operation" class="nav-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 hover:text-white transition" onclick="event.preventDefault(); switchPage('category', '客服')">
                    <i class="fas fa-cogs w-5"></i>
                    <span class="nav-text">客服</span>
                </a>
                <div class="pt-4 pb-2">
                    <span class="nav-text text-xs text-gray-500 uppercase px-4">个人</span>
                </div>
                <a href="#messages" class="nav-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 hover:text-white transition" onclick="event.preventDefault(); switchPage('messages')">
                    <i class="fas fa-envelope w-5"></i>
                    <span class="nav-text">消息中心</span>
                    <span id="msg-badge" class="nav-item-extra hidden ml-auto bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">0</span>
                </a>
                <a href="#profile" class="nav-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 hover:text-white transition" onclick="event.preventDefault(); switchPage('profile')">
                    <i class="fas fa-user w-5"></i>
                    <span class="nav-text">个人中心</span>
                </a>
                <div id="menu-manage" class="hidden">
                    <div class="pt-4 pb-2">
                        <span class="nav-text text-xs text-gray-500 uppercase px-4">作者功能</span>
                    </div>
                    <a href="#manage" class="nav-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 hover:text-white transition" onclick="event.preventDefault(); switchPage('manage')">
                        <i class="fas fa-cog w-5"></i>
                        <span class="nav-text">工具管理</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部导航 -->
            <header class="header flex items-center justify-between px-6">
                <div class="flex items-center gap-4">
                    <button class="text-gray-600 hover:text-gray-900" onclick="document.querySelector('.sidebar').classList.toggle('collapsed')">
                        <i class="fas fa-bars text-lg"></i>
                    </button>
                    <div class="relative">
                        <input id="searchInput" type="text" placeholder="搜索工具..." class="w-64 pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button class="text-gray-600 hover:text-gray-900" onclick="switchPage('messages')">
                        <i class="fas fa-bell text-lg"></i>
                    </button>
                    <div class="relative">
                        <button id="user-menu-button" class="flex items-center gap-2 hover:bg-gray-100 rounded-lg p-1">
                            <div id="avatar-circle" class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm">U</div>
                        </button>
                        <div id="user-menu" class="hidden absolute right-0 mt-2 w-40 bg-white rounded-lg shadow-lg border border-gray-200 py-1">
                            <a href="#" onclick="switchPage('profile'); return false;" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">个人中心</a>
                            <a href="#" onclick="switchPage('messages'); return false;" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">消息中心</a>
                            <hr class="my-1">
                            <a href="#" onclick="handleLogout(); return false;" class="block px-4 py-2 text-sm text-red-600 hover:bg-gray-100">退出登录</a>
                        </div>
                    </div>
                </div>
            </header>

            <!-- 页面容器 -->
            <main class="p-6">
                <div id="page-container"></div>
            </main>
        </div>
    </div>

    <!-- JavaScript 模块 - 按顺序加载 -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/category.js"></script>
    <script src="js/pages/detail.js"></script>
    <script src="js/pages/profile.js"></script>
    <script src="js/pages/manage.js"></script>
    <script src="js/pages/messages.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
