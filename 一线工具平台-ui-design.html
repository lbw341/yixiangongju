<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一线工具平台 UI设计</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 自定义样式 */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 70px;
            --header-height: 64px;
            margin: 0; /* 确保body没有默认margin */
        }
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            transition: width 0.3s ease-in-out;
            z-index: 100;
            overflow: hidden;
            background-color: rgb(31 41 55);
            will-change: width;
            padding: 0.5rem;
        }
        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }
        .nav-text,
        .logo-text,
        .nav-item-extra {
            transition: all 0.3s ease;
            opacity: 1;
            white-space: nowrap;
            display: inline-block;
        }
        .sidebar.collapsed .nav-text,
        .sidebar.collapsed .logo-text,
        .sidebar.collapsed .nav-item-extra {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-20px);
        }
        /* 修复1：确保折叠时图标位置与展开时左侧对齐一致 */
        .sidebar .nav-link {
            position: relative;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
        }
        /* 修改折叠状态下的样式，保持左侧内边距和左对齐 */
        .sidebar.collapsed .nav-link {
            justify-content: flex-start !important; /* 保持左对齐而非居中 */
            padding: 0.75rem 1rem !important; /* 保持与展开状态相同的内边距 */
            gap: 0 !important;
            width: 100%;
        }
        /* 确保图标容器保持一致的位置 */
        .sidebar.collapsed .nav-link i {
            margin: 0 !important; /* 移除自动外边距 */
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        .main-content {
            margin-left: var(--sidebar-width);
            margin-right: 0;
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
            padding-top: var(--header-height);
            min-height: 100vh;
            width: calc(100% - var(--sidebar-width));
            will-change: margin-left, width;
        }
        .sidebar.collapsed ~ .main-content {
            margin-left: var(--sidebar-collapsed-width);
            width: calc(100% - var(--sidebar-collapsed-width));
        }
        /* 修复2：确保标题栏正确延伸 */
        .header {
            height: var(--header-height);
            position: fixed;
            top: 0;
            left: var(--sidebar-width);
            right: 0;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 90;
            background-color: white;
            border-bottom: 1px solid #e5e7eb;
            backdrop-filter: blur(8px);
            padding: 1rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            width: calc(100% - var(--sidebar-width)); /* 明确设置宽度 */
        }
        .sidebar.collapsed ~ .main-content .header {
            left: var(--sidebar-collapsed-width);
            width: calc(100% - var(--sidebar-collapsed-width)); /* 折叠时重新计算宽度 */
        }
        #page-container {
            position: relative;
            z-index: 10;
            width: 100%;
            overflow-x: hidden;
        }
        .dark .header {
            background-color: #1f2937;
            border-color: #374151;
        }
        #toggleSidebar {
            position: relative;
            z-index: 20;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            background-color: transparent;
            transition: all 0.3s ease;
            margin-right: 1rem;
        }
        #toggleSidebar:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
        #toggleSidebar i {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.25rem;
            height: 1.25rem;
            transition: transform 0.3s ease;
        }
        .nav-link.active {
            background-color: #4f46e5;
            color: white;
        }
        .nav-link i {
            width: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .sidebar.collapsed .nav-link i {
            margin-right: 0;
            width: 1.5rem;
            font-size: 1.25rem;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }
        /* 简单的页面切换动画 */
        .page {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div class="flex">
        <aside class="sidebar bg-gray-800 text-white flex flex-col p-4 fixed no-scrollbar overflow-y-auto">
            <div class="text-2xl font-bold mb-8 flex items-center gap-2 nav-item-extra">
                <i class="fas fa-tools text-3xl text-indigo-400"></i>
                <span class="logo-text">一线工具平台</span>
            </div>
            <nav class="flex flex-col gap-2">
                <a href="#home" class="nav-link active flex items-center px-4 py-3 rounded-lg hover:bg-gray-700 transition-colors" onclick="switchPage('home')">
                    <i class="fas fa-home"></i>
                    <span class="nav-text">首页</span>
                </a>
                <span class="px-4 mt-4 mb-1 text-xs uppercase text-gray-400 nav-item-extra">工具分类</span>
                <a href="#planning" class="nav-link flex items-center px-4 py-3 rounded-lg hover:bg-gray-700 transition-colors" onclick="switchPage('category', '规划')">
                    <i class="fas fa-project-diagram"></i>
                    <span class="nav-text">规划</span>
                </a>
                <a href="#construction" class="nav-link flex items-center px-4 py-3 rounded-lg hover:bg-gray-700 transition-colors" onclick="switchPage('category', '建设')">
                    <i class="fas fa-hammer"></i>
                    <span class="nav-text">建设</span>
                </a>
                <a href="#optimization" class="nav-link flex items-center px-4 py-3 rounded-lg hover:bg-gray-700 transition-colors" onclick="switchPage('category', '优化')">
                    <i class="fas fa-chart-line"></i>
                    <span class="nav-text">优化</span>
                </a>
                <a href="#maintenance" class="nav-link flex items-center px-4 py-3 rounded-lg hover:bg-gray-700 transition-colors" onclick="switchPage('category', '维护')">
                    <i class="fas fa-wrench"></i>
                    <span class="nav-text">维护</span>
                </a>
                <a href="#operation" class="nav-link flex items-center px-4 py-3 rounded-lg hover:bg-gray-700 transition-colors" onclick="switchPage('category', '客服')">
                    <i class="fas fa-cogs"></i>
                    <span class="nav-text">客服</span>
                </a>
            </nav>
            <div class="mt-auto p-4 bg-gray-700 rounded-lg text-center nav-item-extra">
                <p class="text-sm">遇到问题？</p>
                <a href="#" class="text-indigo-300 hover:underline text-sm font-semibold">反馈与帮助</a>
            </div>
        </aside>
        <div class="main-content flex-1 flex flex-col">
            <header class="header">
                <button id="toggleSidebar" class="mr-4 w-10 h-10 flex items-center justify-center text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none transition-all duration-300">
                    <i class="fas fa-chevron-left text-xl transition-transform duration-300"></i>
                </button>
                <div class="relative flex-1 max-w-lg flex">
                    <div class="relative flex-1">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="search" id="searchInput" placeholder="搜索工具名称、关键字..." class="w-full bg-gray-100 dark:bg-gray-700 border-none rounded-l-lg pl-10 pr-4 py-2 focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 rounded-r-lg flex items-center justify-center" onclick="performSearch()">
                        搜索
                    </button>
                </div>
                <div class="flex items-center gap-4">
                     <button class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white" onclick="switchPage('messages')">
                        <i class="fas fa-bell text-2xl"></i>
                    </button>
                    <div class="relative" id="user-menu-button">
                        <img src="https://pic1.zhimg.com/v2-abed1a8c04700ba7d72b45195223e0ff_l.jpg?source=32738c0c&needBackground=1" alt="User Avatar" class="w-10 h-10 rounded-full cursor-pointer">
                        <div id="user-menu" class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-lg shadow-lg py-1 hidden ring-1 ring-black ring-opacity-5">
                            <a href="#profile" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700" onclick="switchPage('profile')">
                                <i class="fas fa-user"></i>个人中心
                            </a>
                            <a href="#manage" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700" onclick="switchPage('manage')">
                                <i class="fas fa-toolbox"></i>工具管理
                            </a>
                            <a href="#messages" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700" onclick="switchPage('messages')">
                                <i class="fas fa-bell"></i>消息中心
                            </a>
                            <div class="border-t border-gray-100 dark:border-gray-700 my-1"></div>
                            <a href="#" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">
                                <i class="fas fa-sign-out-alt"></i>退出登录
                            </a>
                        </div>
                    </div>
                </div>
            </header>
            <main class="flex-1 p-8 overflow-y-auto">
                <div id="page-container">
                    </div>
            </main>
        </div>
    </div>
    <script>
        // 模拟数据
        const mockData = {
            tools: [
                { id: 1, name: '需求分析与原型设计模板', type: 'excel', category: '规划', downloads: 1258, author: '产品部-张三', department: '产品部', keywords: '需求, 原型, PRD', description: '一个标准化的Excel模板，用于快速编写产品需求文档和绘制低保真原型。' },
                { id: 2, name: '自动化部署脚本', type: 'python', category: '建设', downloads: 980, author: '运维部-李四', department: '运维部', keywords: 'CI/CD, 部署, python', description: '用于自动化部署Web应用的Python脚本，支持多种环境配置。' },
                { id: 3, name: '数据库巡检工具', type: 'bash', category: '维护', downloads: 760, author: 'DBA-王五', department: '技术中台', keywords: '数据库, 监控, bash', description: '定时巡检数据库健康状况，并生成报告的Bash脚本。' },
                { id: 4, name: '前端性能分析报告', type: 'excel', category: '优化', downloads: 1520, author: '前端组-赵六', department: '研发部', keywords: '性能, 前端, FCP', description: '填写性能指标，自动生成可视化分析报告和优化建议。' },
                { id: 5, name: '用户活动数据提取器', type: 'python', category: '客服', downloads: 2130, author: '数据组-孙七', department: '数据分析部', keywords: '数据, 用户行为, SQL', description: '连接数据仓库，根据配置提取用户活动数据并导出为CSV文件。' },
                { id: 6, name: '项目周报生成器', type: 'excel', category: '规划', downloads: 850, author: '项目管理-周八', department: 'PMO', keywords: '周报, 项目管理', description: '输入本周工作内容，自动格式化并生成项目周报。'},
                { id: 7, name: '代码规范检查工具', type: 'python', category: '建设', downloads: 640, author: '架构组-吴九', department: '技术中台', keywords: 'lint, 代码质量', description: '集成了多种Linter的代码规范自动化检查脚本。'},
            ],
            messages: [
                { id: 1, type: '问题反馈', title: '需求分析模板无法打开', from: '张三', status: '已答复', date: '2025-09-16' },
                { id: 2, type: '问题答复', title: 'Re: 部署脚本报错', from: '李四 (作者)', status: '未读', date: '2025-09-17' },
                { id: 3, type: '系统消息', title: '平台将于今晚进行升级维护', from: '系统管理员', status: '未读', date: '2025-09-17' },
            ],
            user: {
                id: '1001',
                nickname: '勇于攀登的技术猿',
                company: '某互联网公司',
                department: '研发部',
                bio: '一位热爱编码和开源的前端工程师。',
                email: 'user@example.com',
                phone: '138****1234'
            }
        };

        // 页面渲染函数
        const createToolCard = (tool) => `
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4 flex flex-col hover:shadow-xl transition-shadow cursor-pointer" onclick="switchPage('detail', ${tool.id})">
                <div class="flex justify-between items-start">
                    <span class="px-2 py-1 text-xs rounded font-semibold ${
                        {'excel': 'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200',
                         'python': 'bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200',
                         'bash': 'bg-gray-200 text-gray-800 dark:bg-gray-600 dark:text-gray-200',
                         'bat': 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200'}[tool.type] || 'bg-gray-100 text-gray-800'
                    }">${tool.type}</span>
                    <div class="flex items-center gap-1 text-sm text-gray-500 dark:text-gray-400">
                        <i class="fas fa-download"></i>
                        <span>${tool.downloads}</span>
                    </div>
                </div>
                <h3 class="font-bold mt-3 text-lg">${tool.name}</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1 flex-grow">${tool.description.substring(0, 40)}...</p>
                <div class="text-xs text-gray-400 mt-4 pt-2 border-t border-gray-100 dark:border-gray-700">
                    由 ${tool.author} 提供
                </div>
            </div>
        `;

        const homePage = `
            <div class="page pt-6">
                <h1 class="text-3xl font-bold mb-2">欢迎回来！</h1>
                <p class="text-gray-500 dark:text-gray-400 mb-8">开始新的一天，让高效工具助您一臂之力。</p>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-6 mb-8">
                    ${[
                        {name: '规划', icon: 'fa-project-diagram', color: 'text-blue-500', todayUses: 42, totalUses: 1258},
                        {name: '建设', icon: 'fa-hammer', color: 'text-orange-500', todayUses: 38, totalUses: 980},
                        {name: '优化', icon: 'fa-chart-line', color: 'text-green-500', todayUses: 25, totalUses: 760},
                        {name: '维护', icon: 'fa-wrench', color: 'text-purple-500', todayUses: 19, totalUses: 1520},
                        {name: '客服', icon: 'fa-cogs', color: 'text-red-500', todayUses: 63, totalUses: 2130}
                    ].slice(0, 5).map(item => `
                        <div class="stat-card bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md transition-all">
                            <div class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-700 mb-3">
                                <i class="fas ${item.icon} text-xl ${item.color}"></i>
                            </div>
                            <h3 class="text-gray-500 dark:text-gray-400 text-sm font-medium">${item.name}类工具总数</h3>
                            <p class="text-3xl font-bold mt-2">${mockData.tools.filter(t => t.category === item.name).length}</p>
                            <div class="mt-4 space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs text-gray-500 dark:text-gray-400">今日使用次数</span>
                                    <span class="text-sm font-medium">${item.todayUses}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-xs text-gray-500 dark:text-gray-400">总使用次数</span>
                                    <span class="text-sm font-medium">${item.totalUses}</span>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <h2 class="text-2xl font-bold mb-4">最近使用</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    ${mockData.tools.slice(0, 4).map(createToolCard).join('')}
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div>
                        <h2 class="text-2xl font-bold mb-4">工具热度榜</h2>
                        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4 space-y-3">
                            ${[...mockData.tools].sort((a,b) => b.downloads - a.downloads).slice(0,5).map((tool, index) => `
                                <div class="flex items-center justify-between p-2 rounded hover:bg-gray-50 dark:hover:bg-gray-700">
                                    <div class="flex items-center gap-4">
                                        <span class="font-bold text-lg w-6 text-center ${index < 3 ? 'text-indigo-500' : 'text-gray-400'}">${index + 1}</span>
                                        <div>
                                            <p class="font-semibold">${tool.name}</p>
                                            <p class="text-xs text-gray-500 dark:text-gray-400">${tool.author}</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-1 text-sm text-gray-600 dark:text-gray-300">
                                        <i class="fas fa-download"></i>
                                        <span>${tool.downloads}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div>
                        <h2 class="text-2xl font-bold mb-4">作者贡献榜</h2>
                         <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4 space-y-3">
                            ${Object.entries([...mockData.tools].reduce((acc, tool) => { acc[tool.author] = (acc[tool.author] || 0) + 1; return acc; }, {})).sort(([,a],[,b]) => b-a).slice(0,5).map(([author, count], index) => `
                                <div class="flex items-center justify-between p-2 rounded hover:bg-gray-50 dark:hover:bg-gray-700">
                                    <div class="flex items-center gap-4">
                                        <span class="font-bold text-lg w-6 text-center ${index < 3 ? 'text-indigo-500' : 'text-gray-400'}">${index + 1}</span>
                                        <div class="flex items-center gap-3">
                                            <img src="https://pic1.zhimg.com/v2-abed1a8c04700ba7d72b45195223e0ff_l.jpg?source=32738c0c&needBackground=1&text=${author.slice(-1)}" class="w-8 h-8 rounded-full" />
                                            <p class="font-semibold">${author}</p>
                                        </div>
                                    </div>
                                    <div class="text-sm text-gray-600 dark:text-gray-300">
                                        贡献 <strong>${count}</strong> 个工具
                                    </div>
                                </div>
                             `).join('')}
                        </div>
                    </div>
                </div>
            </div>
        `;

        const categoryPage = (category) => `
            <div class="page">
                <h1 class="text-3xl font-bold mb-6">${category}类工具</h1>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    ${mockData.tools.filter(t => t.category === category).map(createToolCard).join('') || '<p class="col-span-full text-center text-gray-500">该分类下暂无工具。</p>'}
                </div>
            </div>
        `;
        
        const searchPage = (query) => {
            const lowerCaseQuery = query.toLowerCase();
            const results = mockData.tools.filter(tool => 
                tool.name.toLowerCase().includes(lowerCaseQuery) ||
                tool.keywords.toLowerCase().includes(lowerCaseQuery) ||
                tool.description.toLowerCase().includes(lowerCaseQuery) ||
                tool.author.toLowerCase().includes(lowerCaseQuery)
            );

            return `
                <div class="page">
                    <h1 class="text-3xl font-bold mb-6">搜索结果: <span class="text-indigo-500">${query}</span></h1>
                    <p class="mb-8 text-gray-600 dark:text-gray-400">共找到 ${results.length} 个相关工具。</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        ${results.length > 0 ? results.map(createToolCard).join('') : '<p class="col-span-full text-center text-gray-500">未找到与您的搜索相关的工具。</p>'}
                    </div>
                </div>
            `;
        };

        const detailPage = (toolId) => {
            const tool = mockData.tools.find(t => t.id === toolId);
            if (!tool) return `<div class="page"><p class="text-center text-gray-500">未找到该工具。</p></div>`;
            
            return `
            <div class="page">
                <div class="flex flex-col md:flex-row justify-between items-start mb-8">
                    <div>
                        <h1 class="text-4xl font-bold">${tool.name}</h1>
                        <div class="flex items-center gap-2 mt-2">

            navLinks.forEach(link => {
                const linkPage = link.getAttribute('href').substring(1);
                 if (pageId === 'category' && ['planning', 'construction', 'maintenance', 'optimization', 'operation'].includes(linkPage)) {
                     link.classList.toggle('active', link.innerText.trim() === param);
                 } else if (['search', 'detail', 'uploadTool', 'profile', 'manage', 'messages'].includes(pageId)) {
                    link.classList.remove('active');
                 } else {
                     link.classList.toggle('active', linkPage === pageId);
                 }
            });
            // 渲染页面内容
            let content = '';
            switch (pageId) {
                case 'home':
                    content = homePage;
                    break;

                    content = categoryPage(param);

                    break;

                    break;

                    break;

                    break;

                    break;

                downloadsChartInstance.destroy();

             downloadsChartInstance = new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: ['4月', '5月', '6月', '7月', '8月', '9月'],
                    datasets: [{
                        label: '下载/调用次数',
                        data: [65, 59, 80, 81, 106, 120],
                        fill: true,
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        borderColor: 'rgb(79, 70, 229)',
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }
        
        const performSearch = () => {
            const query = document.getElementById('searchInput').value;
            if (query && query.trim() !== '') {

            userMenu.classList.toggle('hidden');
        });
        document.addEventListener('click', () => {
             userMenu.classList.add('hidden');
        });
        
        // 搜索框回车事件
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {

        });

                toggleIcon.classList.add(isCollapsed ? 'fa-chevron-right' : 'fa-chevron-left');
            });
